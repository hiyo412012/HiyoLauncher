<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none">
  <defs>
    <linearGradient id="bannerBg" x1="640" y1="0" x2="640" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a2a36"/>
      <stop offset="1" stop-color="#071a22"/>
    </linearGradient>
    <linearGradient id="bannerMark" x1="160" y1="40" x2="160" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9be8dc"/>
      <stop offset="1" stop-color="#6fd6e4"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd6e4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9be8dc" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bannerBg)"/>
  <!-- subtle grid -->
  <g stroke="#6fd6e4" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1120" y1="0" x2="1120" y2="320"/>
  </g>
  <!-- stars -->
  <g fill="#e6f7f9" opacity="0.5">
    <circle cx="90" cy="40" r="1.2"/>
    <circle cx="220" cy="24" r="0.9"/>
    <circle cx="410" cy="52" r="1.1"/>
    <circle cx="580" cy="30" r="0.8"/>
    <circle cx="760" cy="46" r="1.2"/>
    <circle cx="930" cy="28" r="0.9"/>
    <circle cx="1100" cy="50" r="1.1"/>
    <circle cx="1200" cy="34" r="0.8"/>
    <circle cx="150" cy="290" r="1.0"/>
    <circle cx="1080" cy="280" r="1.0"/>
  </g>
  <!-- wave motif -->
  <path d="M0 230 C200 190 400 260 640 220 C880 180 1080 250 1280 210 L1280 320 L0 320 Z" fill="url(#waveFill)"/>
  <path d="M0 250 C220 215 440 275 680 240 C920 205 1120 265 1280 232" fill="none" stroke="#6fd6e4" stroke-opacity="0.35" stroke-width="2"/>
  <!-- mark -->
  <svg x="72" y="64" width="192" height="192" viewBox="0 0 256 256">
    <rect x="54" y="40" width="56" height="176" rx="28" fill="url(#bannerMark)"/>
    <rect x="146" y="40" width="56" height="176" rx="28" fill="url(#bannerMark)"/>
    <rect x="54" y="96" width="148" height="64" rx="32" fill="url(#bannerMark)"/>
  </svg>
  <!-- title -->
  <text x="296" y="150" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-1.5" fill="#e6f7f9">HiyoLauncher</text>
  <text x="298" y="196" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#9be8dc" opacity="0.9">Your world. Your launcher.</text>
</svg>